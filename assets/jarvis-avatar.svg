<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#0d3a7d"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd15c"/>
      <stop offset="100%" stop-color="#f5a524"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- subtle skyline behind the house -->
  <g opacity="0.14" fill="#ffffff">
    <rect x="64"  y="250" width="46" height="150" rx="6"/>
    <rect x="122" y="212" width="40" height="188" rx="6"/>
    <rect x="350" y="228" width="42" height="172" rx="6"/>
    <rect x="404" y="266" width="44" height="134" rx="6"/>
  </g>

  <g filter="url(#soft)">
    <!-- roof -->
    <path d="M256 116 L410 232 L102 232 Z" fill="url(#roof)"/>
    <!-- body -->
    <rect x="146" y="232" width="220" height="164" rx="18" fill="#ffffff"/>
    <!-- door -->
    <rect x="228" y="300" width="56" height="96" rx="10" fill="#1f6feb"/>
    <!-- windows -->
    <rect x="172" y="266" width="46" height="46" rx="9" fill="#cfe0ff"/>
    <rect x="294" y="266" width="46" height="46" rx="9" fill="#cfe0ff"/>
  </g>

  <!-- alert pulse: the bot's whole job is telling you the moment one appears -->
  <circle cx="386" cy="150" r="44" fill="#ff5c5c"/>
  <circle cx="386" cy="150" r="44" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.85"/>
  <path d="M386 126 v30" stroke="#fff" stroke-width="11" stroke-linecap="round"/>
  <circle cx="386" cy="172" r="6.5" fill="#ffffff"/>
</svg>
